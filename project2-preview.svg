  <text x="245" y="435" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">ST-2026-177</text>
  <text x="340" y="435" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Ashok Kumar</text>
  <text x="480" y="435" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">HND Computing</text>
  <text x="610" y="435" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">3.78</text>
  <rect x="685" y="420" width="65" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
  <text x="717" y="435" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Merit</text>
