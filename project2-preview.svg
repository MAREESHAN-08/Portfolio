  <text x="480" y="355" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Software Eng.</text>
  <text x="610" y="355" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">3.92</text>
  <rect x="685" y="340" width="65" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
  <text x="717" y="355" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Honors</text>

