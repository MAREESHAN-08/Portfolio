  <text x="480" y="395" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">IT Diploma</text>
  <text x="610" y="395" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">3.65</text>
  <rect x="685" y="380" width="65" height="22" rx="11" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="717" y="395" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Passed</text>

